name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:

  frontend:
    name: Frontend — install + test + build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Run frontend tests
        run: npx vitest run --reporter=verbose
        env:
          VITE_FIREBASE_API_KEY: test
          VITE_FIREBASE_AUTH_DOMAIN: test.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: test
          VITE_FIREBASE_STORAGE_BUCKET: test.appspot.com
          VITE_FIREBASE_MESSAGING_SENDER_ID: "000000000000"
          VITE_FIREBASE_APP_ID: 1:000000000000:web:test
          VITE_API_URL: http://localhost:5000
      - name: Coverage report (informational — not a gate yet)
        run: npm run test:coverage -- --reporter=verbose
        continue-on-error: true
        env:
          VITE_FIREBASE_API_KEY: test
          VITE_FIREBASE_AUTH_DOMAIN: test.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: test
          VITE_FIREBASE_STORAGE_BUCKET: test.appspot.com
          VITE_FIREBASE_MESSAGING_SENDER_ID: "000000000000"
          VITE_FIREBASE_APP_ID: 1:000000000000:web:test
          VITE_API_URL: http://localhost:5000
      - name: Vite production build
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

  backend:
    name: Backend — install + validate + test
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Validate canonical problem source
        run: npm run validate:problems-canonical
      - name: Validate problem folders
        run: npm run validate:problem-folders
      - name: Validate problem authoring checklist
        run: npm run validate:problem-authoring
      - name: Audit problem content quality (legacy inventory)
        run: npm run audit:problem-content -- --json
      - name: Audit full problem bank
        run: npm run audit:problem-bank
      - name: Validate P6 migration plan
        run: npm run migrate:problem-bank:p6 -- --json
      - name: Validate problem contracts
        run: npm run validate:problems
      - name: Audit problem duplicates
        run: npm run audit:problem-duplicates
      - name: Run backend tests
        run: npm test -- --reporter=verbose
        env:
          NODE_ENV: test
          MONGODB_URI: ""
          FIREBASE_PROJECT_ID: test
          FIREBASE_CLIENT_EMAIL: test@test.iam.gserviceaccount.com
          FIREBASE_PRIVATE_KEY: "-----BEGIN RSA PRIVATE KEY-----\nMIItest\n-----END RSA PRIVATE KEY-----\n"
      - name: Coverage report (informational — not a gate yet)
        run: npm run test:coverage -- --reporter=verbose
        continue-on-error: true
        env:
          NODE_ENV: test
          MONGODB_URI: ""
          FIREBASE_PROJECT_ID: test
          FIREBASE_CLIENT_EMAIL: test@test.iam.gserviceaccount.com
          FIREBASE_PRIVATE_KEY: "-----BEGIN RSA PRIVATE KEY-----\nMIItest\n-----END RSA PRIVATE KEY-----\n"
      - name: Run backend integration tests (real in-memory MongoDB)
        run: npm run test:integration -- --reporter=verbose
        env:
          NODE_ENV: test
          FIREBASE_PROJECT_ID: test
          FIREBASE_CLIENT_EMAIL: test@test.iam.gserviceaccount.com
          FIREBASE_PRIVATE_KEY: "-----BEGIN RSA PRIVATE KEY-----\nMIItest\n-----END RSA PRIVATE KEY-----\n"
      - name: Run Redis execution queue integration tests
        run: npx vitest run services/executionQueue.integration.test.js --reporter=verbose
        env:
          NODE_ENV: test
          REDIS_URL: redis://127.0.0.1:6379
          RUN_REDIS_INTEGRATION_TESTS: "true"
