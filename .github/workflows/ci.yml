name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:

  frontend:
    name: Frontend — install + test + build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Run frontend tests
        run: npx vitest run --reporter=verbose
        env:
          VITE_FIREBASE_API_KEY: test
          VITE_FIREBASE_AUTH_DOMAIN: test.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: test
          VITE_FIREBASE_STORAGE_BUCKET: test.appspot.com
          VITE_FIREBASE_MESSAGING_SENDER_ID: "000000000000"
          VITE_FIREBASE_APP_ID: 1:000000000000:web:test
          VITE_API_URL: http://localhost:5000
      - name: Coverage report (informational — not a gate yet)
        run: npm run test:coverage -- --reporter=verbose
        continue-on-error: true
        env:
          VITE_FIREBASE_API_KEY: test
          VITE_FIREBASE_AUTH_DOMAIN: test.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: test
          VITE_FIREBASE_STORAGE_BUCKET: test.appspot.com
          VITE_FIREBASE_MESSAGING_SENDER_ID: "000000000000"
          VITE_FIREBASE_APP_ID: 1:000000000000:web:test
          VITE_API_URL: http://localhost:5000
      - name: Vite production build
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

  backend:
    name: Backend — install + validate + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Validate canonical problem source
        run: npm run validate:problems-canonical
      - name: Validate problem folders
        run: npm run validate:problem-folders
      - name: Validate problem contracts
        run: npm run validate:problems
      - name: Audit problem duplicates
        run: npm run audit:problem-duplicates
      - name: Capture canonical contract diagnostics
        if: always()
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { loadProblemsFromFolders } from './scripts/lib/loadProblemsFromFolders.js';
          import { validateProblems } from './scripts/validateProblemContracts.js';
          const problems = await loadProblemsFromFolders();
          const errors = validateProblems(problems);
          const report = errors.length
            ? [`Found ${errors.length} canonical contract error(s):`, ...errors.map((error) => `- ${error}`)].join('\n')
            : `Canonical problem bank: ${problems.length} problems, no contract errors.`;
          fs.writeFileSync('contract-errors.txt', `${report}\n`, 'utf8');
          console.log(report);
          NODE
      - name: Run backend tests
        run: npm test -- --reporter=verbose
        env:
          NODE_ENV: test
          MONGODB_URI: ""
          FIREBASE_PROJECT_ID: test
          FIREBASE_CLIENT_EMAIL: test@test.iam.gserviceaccount.com
          FIREBASE_PRIVATE_KEY: "-----BEGIN RSA PRIVATE KEY-----\nMIItest\n-----END RSA PRIVATE KEY-----\n"
      - name: Upload canonical contract diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p3-contract-diagnostics
          path: backend/contract-errors.txt
          if-no-files-found: warn
      - name: Coverage report (informational — not a gate yet)
        run: npm run test:coverage -- --reporter=verbose
        continue-on-error: true
        env:
          NODE_ENV: test
          MONGODB_URI: ""
          FIREBASE_PROJECT_ID: test
          FIREBASE_CLIENT_EMAIL: test@test.iam.gserviceaccount.com
          FIREBASE_PRIVATE_KEY: "-----BEGIN RSA PRIVATE KEY-----\nMIItest\n-----END RSA PRIVATE KEY-----\n"
      - name: Run backend integration tests (real in-memory MongoDB)
        run: npm run test:integration -- --reporter=verbose
        env:
          NODE_ENV: test
          FIREBASE_PROJECT_ID: test
          FIREBASE_CLIENT_EMAIL: test@test.iam.gserviceaccount.com
          FIREBASE_PRIVATE_KEY: "-----BEGIN RSA PRIVATE KEY-----\nMIItest\n-----END RSA PRIVATE KEY-----\n"
